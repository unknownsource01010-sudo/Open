name: PromoProwler v12 - Test, Package, Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "PromoProwler_COMPLETE_v12_GITHUB_READY.zip"
      - "worker/**"
      - "tests/**"
      - "index.html"
      - ".github/workflows/deploy-promoprowler-v12.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: promoprowler-v12
  cancel-in-progress: true

jobs:
  test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack PromoProwler source when repo contains the ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [ -f worker/core.py ]; then
            echo "PromoProwler source is already extracted."
          elif [ -f PromoProwler_COMPLETE_v12_GITHUB_READY.zip ]; then
            unzip -o PromoProwler_COMPLETE_v12_GITHUB_READY.zip
          else
            echo "::error::Neither worker/core.py nor PromoProwler_COMPLETE_v12_GITHUB_READY.zip was found at repository root."
            exit 1
          fi

          test -f worker/core.py
          test -f worker/promo_engine.py
          test -f worker/server.py
          test -f worker/adapters/ebay.py
          test -f worker/adapters/walmart.py
          test -f index.html

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt

      - name: Syntax and unit tests
        run: |
          python -m py_compile \
            worker/core.py \
            worker/promo_engine.py \
            worker/server.py \
            worker/adapters/ebay.py \
            worker/adapters/walmart.py
          PYTHONPATH=worker python -m unittest discover -s tests -v

      - name: Build verified project artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/promoprowler-v12
          mkdir -p build/promoprowler-v12
          cp -R worker tests index.html README.md build/promoprowler-v12/
          cd build
          zip -qr PromoProwler-v12-verified.zip promoprowler-v12
          sha256sum PromoProwler-v12-verified.zip > PromoProwler-v12-verified.zip.sha256
          unzip -t PromoProwler-v12-verified.zip

      - name: Upload verified downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: PromoProwler-v12-verified
          path: |
            build/PromoProwler-v12-verified.zip
            build/PromoProwler-v12-verified.zip.sha256
          if-no-files-found: error

  deploy-pages:
    needs: test-package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack PromoProwler source when repo contains the ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [ -f index.html ] && [ -f worker/core.py ]; then
            echo "PromoProwler source is already extracted."
          elif [ -f PromoProwler_COMPLETE_v12_GITHUB_READY.zip ]; then
            unzip -o PromoProwler_COMPLETE_v12_GITHUB_READY.zip
          else
            echo "::error::PromoProwler source ZIP/source tree not found."
            exit 1
          fi
          test -f index.html

      - name: Prepare static Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
